name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tradingdashboard
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'
  PROJECT_PATH: src/TradingDashboard.API/TradingDashboard.API.csproj
  SOLUTION_PATH: TradingDashboard.slnx
  PUBLISH_PATH: ./publish
  CLIENT_PATH: src/TradingDashboard.Client
  CLIENT_BUILD_ARTIFACT: client-build
  API_PUBLISH_ARTIFACT: publish-artifact

permissions:
  contents: read

jobs:

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/TradingDashboard.Client/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm ci

      - name: Build React
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLIENT_BUILD_ARTIFACT }}
          path: src/TradingDashboard.API/wwwroot
          if-no-files-found: error

  build:
    name: Build API + Package SPA
    runs-on: ubuntu-latest
    needs: [build-client]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download client build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLIENT_BUILD_ARTIFACT }}
          path: src/TradingDashboard.API/wwwroot

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_PATH }} --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_PUBLISH_ARTIFACT }}
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --verbosity normal

  migrations:
    name: Apply DB Migrations
    needs: test
    runs-on: ubuntu-latest
    if: ${{ needs.test.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Install EF Core Tools
        run: dotnet tool install -g dotnet-ef

      - name: Apply Database Migrations
        run: |
          dotnet ef database update \
            --project src/TradingDashboard.Infrastructure \
            --startup-project src/TradingDashboard.API \
            --verbose
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}

  deploy:
    name: Deploy to Azure
    needs: [build, test, migrations]
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' && needs.test.result == 'success' && needs.migrations.result == 'success' }}
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_PUBLISH_ARTIFACT }}
          path: ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}