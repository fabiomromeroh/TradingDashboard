name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tradingdashboard
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/TradingDashboard.API/TradingDashboard.API.csproj
  SOLUTION_PATH: TradingDashboard.slnx
  PUBLISH_PATH: ./publish

permissions:
  contents: read

jobs:

  # ── Detect which parts of the repo changed ─────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:    ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'src/TradingDashboard.API/**'
              - 'src/TradingDashboard.Application/**'
              - 'src/TradingDashboard.Domain/**'
              - 'src/TradingDashboard.Infrastructure/**'
              - 'tests/**'
              - 'TradingDashboard.slnx'
            client:
              - 'src/TradingDashboard.Client/**'

  # ── CLIENT pipeline ─────────────────────────────────────────────────────────
  deploy-client:
    name: Build & Deploy Client
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/TradingDashboard.Client/package-lock.json

      - name: Install & Build React
        working-directory: src/TradingDashboard.Client
        run: |
          npm ci
          npm run build

      - name: Deploy Client to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: src/TradingDashboard.API/wwwroot

  # ── API pipeline ─────────────────────────────────────────────────────────────
  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_PATH }}

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-artifact
          path: ${{ env.PUBLISH_PATH }}

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

  migrations:
    name: Apply DB Migrations
    needs: test
    runs-on: ubuntu-latest
    if: ${{ needs.test.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Install EF Core Tools
        run: dotnet tool install -g dotnet-ef

      - name: Apply Database Migrations
        run: |
          dotnet ef database update \
            --project src/TradingDashboard.Infrastructure \
            --startup-project src/TradingDashboard.API \
            --verbose
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}

  deploy:
    name: Deploy API to Azure
    needs: [test, migrations]
    runs-on: ubuntu-latest
    if: ${{ needs.test.result == 'success' && needs.migrations.result == 'success' }}
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish-artifact
          path: ${{ env.PUBLISH_PATH }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}