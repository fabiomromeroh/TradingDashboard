name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tradingdashboard
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  PROJECT_PATH: src/TradingDashboard.API/TradingDashboard.API.csproj
  SOLUTION_PATH: TradingDashboard.slnx
  PUBLISH_PATH: ./publish
  CLIENT_PATH: src/TradingDashboard.Client
  API_PUBLISH_ARTIFACT: publish-artifact

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build Client + API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/TradingDashboard.Client/package-lock.json

      - name: Install client dependencies
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm ci

      - name: Build React client
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm run build

      - name: Verify React build output
        run: |
          echo "Contents of API wwwroot after client build:"
          ls -la src/TradingDashboard.API/wwwroot
          test -f src/TradingDashboard.API/wwwroot/index.html

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

      - name: Publish API with SPA assets
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_PATH }}

      - name: Verify published SPA files
        run: |
          echo "Contents of publish output:"
          ls -la ${{ env.PUBLISH_PATH }}
          echo "Contents of published wwwroot:"
          ls -la ${{ env.PUBLISH_PATH }}/wwwroot
          test -f ${{ env.PUBLISH_PATH }}/wwwroot/index.html

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.API_PUBLISH_ARTIFACT }}
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error

  migrations:
    name: Apply DB Migrations
    needs: build-test-publish
    runs-on: ubuntu-latest
    if: ${{ needs.build-test-publish.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Install EF Core Tools
        run: dotnet tool install -g dotnet-ef

      - name: Apply Database Migrations
        run: |
          dotnet ef database update \
            --project src/TradingDashboard.Infrastructure \
            --startup-project src/TradingDashboard.API \
            --verbose
        env:
          ASPNETCORE_ENVIRONMENT: Production
          DOTNET_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}

  deploy:
    name: Deploy to Azure
    needs: [build-test-publish, migrations]
    runs-on: ubuntu-latest
    if: ${{ needs.build-test-publish.result == 'success' && needs.migrations.result == 'success' }}
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_PUBLISH_ARTIFACT }}
          path: ${{ env.PUBLISH_PATH }}

      - name: Verify deployment package
        run: |
          ls -la ${{ env.PUBLISH_PATH }}
          ls -la ${{ env.PUBLISH_PATH }}/wwwroot
          test -f ${{ env.PUBLISH_PATH }}/wwwroot/index.html

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_PATH }}