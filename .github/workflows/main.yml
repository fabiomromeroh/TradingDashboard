name: Deploy to Azure App Service

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tradingdashboard
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/TradingDashboard.API/TradingDashboard.API.csproj
  SOLUTION_PATH: TradingDashboard.slnx
  PUBLISH_PATH: ./publish

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}
      
      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
      
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_PATH }} --no-build

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure App Service settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "Jwt__SecretKey",
                "value": "${{ secrets.JWT_SECRETKEY }}",
                "slotSetting": false
              },
              {
                "name": "Jwt__Issuer",
                "value": "${{ secrets.JWT_ISSUER }}",
                "slotSetting": false
              },
              {
                "name": "Jwt__Audience",
                "value": "${{ secrets.JWT_AUDIENCE }}",
                "slotSetting": false
              },
              {
                "name": "Jwt__ExpiryMinutes",
                "value": "${{ secrets.JWT_EXPIRYMINUTES }}",
                "slotSetting": false
              },
              {
                "name": "ASPNETCORE_ENVIRONMENT",
                "value": "Production",
                "slotSetting": false
              }
            ]
          connection-strings-json: |
            [
              {
                "name": "DefaultConnection",
                "value": "${{ secrets.DB_CONNECTION_STRING }}",
                "type": "SQLAzure",
                "slotSetting": false
              }
            ]

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_PATH }}
