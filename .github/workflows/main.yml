name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production  # ← Uses GitHub Environment secrets
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/TradingDashboard.API/TradingDashboard.API.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service (example)
        uses: azure/webapps-deploy@v3
        with:
          app-name: your-app-name
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
        env:
          CONNECTIONSTRING__DEFAULTCONNECTION: ${{ secrets.CONNECTIONSTRING__DEFAULTCONNECTION }}
          JWT_SECRETKEY: ${{ secrets.JWT_SECRETKEY }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          JWT_EXPIRYMINUTES: ${{ secrets.JWT_EXPIRYMINUTES }}
          ASPNETCORE_ENVIRONMENT: Production
